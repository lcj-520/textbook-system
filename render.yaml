services:
  - type: web
    name: textbook-system
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_USER
        value: lcj
      # 部署时由 Render 提示输入，不会保存到仓库
      - key: APP_PASSWORD
        sync: false
